name: Admin Dashboard CI

# ──────────────────────────────────────────────────────────────────────────
# Runs on every push / PR that touches admin sources.
# Jobs:
#   quality  — ESLint, TypeScript type-check, Vitest (with coverage)
#   build    — Vite production build + artifact upload
#   deploy   — static deploy (staging → develop / production → main)
#
# Required secrets / variables:
#   VITE_API_BASE_URL          — GitHub Actions variable (not secret) per environment
#   DEPLOY_HOST                — SSH hostname for rsync deploy (or set your CDN action)
#   DEPLOY_USER                — SSH user
#   DEPLOY_PATH                — remote web root
#   SSH_PRIVATE_KEY            — SSH private key
#   SLACK_WEBHOOK_URL          — failure notifications (optional)
#
# For Vercel:   swap the "Deploy" step for amondnet/vercel-action@v25
# For Netlify:  swap for nwtgck/actions-netlify@v3
# For AWS S3:   swap for aws-actions/configure-aws-credentials + aws s3 sync
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop]
    paths:
      - "admin/**"
      - ".github/workflows/admin.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "admin/**"
      - ".github/workflows/admin.yml"

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: admin

env:
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. Lint, type-check, and unit tests
  # ──────────────────────────────────────────────────────────────────────
  quality:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: Unit tests with coverage
        run: npm test -- --coverage --reporter=verbose

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-coverage-${{ github.sha }}
          path: admin/coverage/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────
  # 2. Production build
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      # Use GitHub Actions variables (vars.*) for non-sensitive build-time config.
      # Set VITE_API_BASE_URL in Settings → Environments → Variables per environment.
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist-${{ github.sha }}
          path: admin/dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # 3a. Deploy to staging (develop branch)
  # ──────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
    environment:
      name: staging
      url: https://admin.staging.chitsmart.in

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist-${{ github.sha }}
          path: dist/

      - name: Deploy via rsync (staging)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_STAGING }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_ADMIN_STAGING }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete --checksum dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

  # ──────────────────────────────────────────────────────────────────────
  # 3b. Deploy to production (main branch)
  # ──────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    environment:
      name: production
      url: https://admin.chitsmart.in

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist-${{ github.sha }}
          path: dist/

      - name: Deploy via rsync (production)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_PROD }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_ADMIN_PROD }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete --checksum dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

  # ──────────────────────────────────────────────────────────────────────
  # 4. Failure notification
  # ──────────────────────────────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [quality, build, deploy-staging, deploy-production]
    if: failure() && github.event_name == 'push'
    permissions:
      contents: none

    steps:
      - name: Send Slack alert
        if: ${{ vars.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *Admin CI failed* on `${{ github.ref_name }}` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
