name: Admin Dashboard CI

on:
  push:
    branches: [main, develop]
    paths:
      - "admin/**"
      - ".github/workflows/admin.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "admin/**"
      - ".github/workflows/admin.yml"

defaults:
  run:
    working-directory: admin

env:
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────
  # 1. Lint, type-check, and unit tests
  # ──────────────────────────────────────────────
  quality:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

  # ──────────────────────────────────────────────
  # 2. Production build
  # ──────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Vite picks up VITE_* env vars at build time.
          # Override the API base URL per environment via repository / environment secrets.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:8000' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist-${{ github.sha }}
          path: admin/dist/
          retention-days: 7

  # ──────────────────────────────────────────────
  # 3. Deploy static build (main / develop only)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy Admin Dashboard
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist-${{ github.sha }}
          path: dist/

      # ── Replace the step below with your hosting provider ──
      # Example shows a generic rsync-over-SSH deploy.
      # For Vercel: use amondnet/vercel-action@v25
      # For Netlify: use nwtgck/actions-netlify@v3
      # For S3+CloudFront: use aws-actions/configure-aws-credentials + aws s3 sync
      - name: Deploy via rsync (example — replace with your provider)
        if: ${{ env.DEPLOY_HOST != '' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
