name: Android CI

# ──────────────────────────────────────────────────────────────────────────
# Runs on every push / PR that touches Android sources.
# Jobs:
#   lint          — Android Lint (all variants)
#   unit-test     — JVM unit tests (debug variant)
#   build-debug   — assemble debug APK (every branch, gated on lint + test)
#   build-release — bundle signed AAB for Play Store (main only)
#   deploy        — upload AAB to Play internal track (main only, if secret set)
#
# Required secrets:
#   GOOGLE_SERVICES_JSON_BASE64  — base64-encoded app/google-services.json
#   KEYSTORE_BASE64              — base64-encoded .jks / .p12 keystore
#   KEYSTORE_PASSWORD            — keystore password
#   KEY_ALIAS                    — signing key alias
#   KEY_PASSWORD                 — signing key password
#   PLAY_SERVICE_ACCOUNT_JSON    — Google Play service account JSON (deploy only)
#   SLACK_WEBHOOK_URL            — failure notifications (optional)
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "app/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "gradle.properties"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: temurin
  # Daemon is useless in CI and wastes memory.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. Android Lint
  # ──────────────────────────────────────────────────────────────────────
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew -PskipGoogleServices=true lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-${{ github.sha }}
          path: app/build/reports/lint-results*.html
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # 2. JVM Unit Tests
  # ──────────────────────────────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew -PskipGoogleServices=true testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results-${{ github.sha }}
          path: app/build/reports/tests/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # 3. Build debug APK (every branch, gated on lint + test)
  # ──────────────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Restore Firebase config for debug builds if the secret is available.
      - name: Restore google-services.json (debug)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set — building with -PskipGoogleServices=true"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: |
          if [ -f app/google-services.json ]; then
            ./gradlew :app:assembleCloudDebug
          else
            ./gradlew -PskipGoogleServices=true :app:assembleCloudDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chitsmart-debug-${{ github.sha }}
          path: app/build/outputs/apk/cloud/debug/*.apk
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────
  # 4. Build signed release AAB (main branch only)
  #    Requires KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD,
  #    and GOOGLE_SERVICES_JSON_BASE64 secrets.
  # ──────────────────────────────────────────────────────────────────────
  build-release:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is required for release builds."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is required for release builds."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release AAB
        run: ./gradlew :app:bundleCloudRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: chitsmart-release-${{ github.sha }}
          path: app/build/outputs/bundle/cloudRelease/*.aab
          retention-days: 30

      # ── Clean up sensitive files ──────────────────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f keystore.jks

  # ──────────────────────────────────────────────────────────────────────
  # 5. Upload to Google Play internal track
  # ──────────────────────────────────────────────────────────────────────
  deploy-play-store:
    name: Upload to Play Store (Internal Track)
    runs-on: ubuntu-latest
    needs: build-release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
    environment:
      name: production
      url: https://play.google.com/console

    steps:
      - name: Download release AAB
        uses: actions/download-artifact@v4
        with:
          name: chitsmart-release-${{ github.sha }}
          path: aab/

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.chitsmart
          releaseFiles: aab/*.aab
          track: internal
          status: completed
          # changesNotSentForReview: false

  # ──────────────────────────────────────────────────────────────────────
  # 6. Failure notification
  # ──────────────────────────────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, unit-test, build-debug, build-release, deploy-play-store]
    if: failure() && github.event_name == 'push'
    permissions:
      contents: none

    steps:
      - name: Send Slack alert
        if: ${{ vars.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *Android CI failed* on `${{ github.ref_name }}` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
