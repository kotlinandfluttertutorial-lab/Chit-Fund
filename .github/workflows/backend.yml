name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

env:
  PYTHON_VERSION: "3.12"
  # Test database — spun up by the service container below
  DATABASE_URL: postgresql+asyncpg://chitsmart:chitsmart@localhost:5432/chitsmart_test
  SECRET_KEY: test-secret-key-not-for-production-use
  OPENAI_API_KEY: sk-test-placeholder
  OTP_EXPIRE_MINUTES: "10"
  DEBUG: "true"

jobs:
  # ──────────────────────────────────────────────
  # 1. Lint & type-check
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff mypy

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy app --ignore-missing-imports --no-error-summary

  # ──────────────────────────────────────────────
  # 2. Unit + integration tests
  # ──────────────────────────────────────────────
  test:
    name: Test (Python ${{ env.PYTHON_VERSION }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chitsmart
          POSTGRES_PASSWORD: chitsmart
          POSTGRES_DB: chitsmart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U chitsmart"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations on test DB
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --tb=short --asyncio-mode=auto

  # ──────────────────────────────────────────────
  # 3. Build Docker image (main / develop only)
  # ──────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: meta
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          SHA="${GITHUB_SHA::8}"
          if [ "$BRANCH" = "main" ]; then
            echo "tag=ghcr.io/${{ github.repository_owner }}/chitsmart-backend:latest" >> "$GITHUB_OUTPUT"
            echo "extra_tag=ghcr.io/${{ github.repository_owner }}/chitsmart-backend:$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ghcr.io/${{ github.repository_owner }}/chitsmart-backend:develop" >> "$GITHUB_OUTPUT"
            echo "extra_tag=ghcr.io/${{ github.repository_owner }}/chitsmart-backend:develop-$SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.extra_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
