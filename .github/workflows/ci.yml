name: CI


# ──────────────────────────────────────────────────────────────────────────
# Consolidated quality gate — runs on every PR and push to main / develop.
# Each job is path-scoped so only the affected layer runs.
#
# Required status checks to add in GitHub branch protection:
#   • "CI / Admin — Lint, Type-Check, Test & Build"
#   • "CI / Backend — Lint & Test"
#   • "CI / Android — Lint & Unit Test"
# ──────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel in-flight runs for the same ref so pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Admin dashboard — Node 20, Vite, Vitest
  # ──────────────────────────────────────────────────────────────────────────
  admin:
    name: Admin — Lint, Type-Check, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: admin

    # Only run when admin sources or this workflow file change.
    if: |
      github.event_name == 'push' ||
      startsWith(github.event.pull_request.base.ref, 'main') ||
      startsWith(github.event.pull_request.base.ref, 'develop')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: Unit tests (with coverage)
        run: npm test -- --coverage --reporter=verbose

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-coverage-${{ github.sha }}
          path: admin/coverage/
          retention-days: 14

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:8000/api/v1' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist-${{ github.sha }}
          path: admin/dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Backend — Python 3.12, FastAPI, pytest + Postgres 16
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chitsmart
          POSTGRES_PASSWORD: chitsmart
          POSTGRES_DB: chitsmart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U chitsmart"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://chitsmart:chitsmart@localhost:5432/chitsmart_test
      SECRET_KEY: ci-only-secret-key-not-for-production
      OPENAI_API_KEY: sk-test-placeholder
      OTP_EXPIRE_MINUTES: "10"
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff mypy pytest-cov

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy app --ignore-missing-imports --no-error-summary

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --asyncio-mode=auto \
            --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage.xml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # Android — JDK 17, Gradle, Kotlin
  # ──────────────────────────────────────────────────────────────────────────
  android:
    name: Android — Lint & Unit Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Android Lint
        run: ./gradlew -PskipGoogleServices=true lint

      - name: Unit tests
        run: ./gradlew -PskipGoogleServices=true testDebugUnitTest

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-${{ github.sha }}
          path: app/build/reports/lint-results*.html
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results-${{ github.sha }}
          path: app/build/reports/tests/
          retention-days: 7
