name: CI

# Consolidated quality gate for pull requests and pushes.
# Each job runs only when its layer's files change (path filters).
# Add "CI / Admin — Lint, Type-Check, Test & Build",
# "CI / Backend — Lint & Test", and "CI / Android — Lint & Unit Test"
# as required status checks in GitHub branch protection.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Admin dashboard — Node 20, Vite, Vitest
  # ──────────────────────────────────────────────────────────────────────────
  admin:
    name: Admin — Lint, Type-Check, Test & Build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(toJson(github.event.pull_request.changed_files), 'admin/')
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist-${{github.sha}}
          path: admin/dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Backend — Python 3.12, FastAPI, pytest + Postgres 16
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(toJson(github.event.pull_request.changed_files), 'backend/')
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chitsmart
          POSTGRES_PASSWORD: chitsmart
          POSTGRES_DB: chitsmart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U chitsmart"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://chitsmart:chitsmart@localhost:5432/chitsmart_test
      SECRET_KEY: test-secret-key-not-for-production
      OPENAI_API_KEY: sk-test-placeholder
      OTP_EXPIRE_MINUTES: "10"
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --tb=short --asyncio-mode=auto

  # ──────────────────────────────────────────────────────────────────────────
  # Android — JDK 17, Gradle, Kotlin
  # ──────────────────────────────────────────────────────────────────────────
  android:
    name: Android — Lint & Unit Test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(toJson(github.event.pull_request.changed_files), 'app/')
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{runner.os}}-${{hashFiles('**/*.gradle*', '**/gradle-wrapper.properties')}}
          restore-keys: gradle-${{runner.os}}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Android Lint
        run: ./gradlew -PskipGoogleServices=true lint

      - name: Unit tests
        run: ./gradlew -PskipGoogleServices=true testDebugUnitTest

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-${{github.sha}}
          path: app/build/reports/lint-results*.html
          retention-days: 7
