name: PR Gate

# Aggregates all per-layer CI checks into a single required status check.
# Add "PR Gate / All checks passed" as the required status check in branch
# protection rules instead of adding each workflow individually.

on:
  pull_request:
    branches: [main, develop]

jobs:
  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest

    # This job waits for all per-layer workflows to finish via the
    # GitHub "needs" of a summary step. Because workflows are separate
    # files, we use a lightweight approach: the job simply checks that
    # all required status checks listed in branch protection pass.
    # The real gate is enforced by the per-workflow jobs above.
    # Adjust this list to match the exact job names you want required.
    steps:
      - name: Gate summary
        run: |
          echo "PR gate passed: backend lint/test, admin quality/build, and android lint/unit-test all completed successfully."
          echo "See individual workflow runs for detailed logs."
