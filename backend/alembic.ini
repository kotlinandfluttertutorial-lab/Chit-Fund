# Alembic configuration file for ChitSmart backend.
# The DATABASE_URL is injected at runtime via env.py (reads from app settings),
# so the sqlalchemy.url value here is a placeholder only.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder — overridden in alembic/env.py via settings.DATABASE_URL
sqlalchemy.url = postgresql+asyncpg://chitsmart:password@localhost:5432/chitsmart_dev

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
