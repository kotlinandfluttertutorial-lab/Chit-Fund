# =============================================================================
# docker-compose.cloud.yml — CLOUD / production override
#
# Layer this on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d
#
# What changes vs local
# ----------------------
# • Builds the "prod" Dockerfile stage (source baked in, multi-worker).
# • No volume mount — code is immutable inside the image.
# • No local DB container — DATABASE_URL points to managed cloud DB.
# • All secrets come from the environment (CI / secret manager), not .env files.
# • Uvicorn workers controlled by WEB_CONCURRENCY (default 2).
# =============================================================================

version: "3.9"

services:
  # No db service in cloud — use your managed PostgreSQL (Cloud SQL, RDS, Supabase, etc.)

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod          # <-- build the prod stage
    container_name: chitsmart_api
    restart: always
    # No env_file in cloud — inject secrets via your cloud provider / CI pipeline.
    # Minimum required env vars (set in your cloud secret manager / CI):
    #   ENV=cloud
    #   DATABASE_URL=postgresql+asyncpg://...
    #   SECRET_KEY=<strong random hex>
    #   FIREBASE_SERVICE_ACCOUNT_JSON=<inline JSON string>
    #   OPENAI_API_KEY=sk-...
    #   PAYMENT_KEY_ID=rzp_live_...
    #   PAYMENT_KEY_SECRET=...
    #   ALLOWED_ORIGINS=https://admin.yourdomain.com
    #   STORAGE_BACKEND=s3
    #   AWS_BUCKET_NAME=chitsmart-uploads
    #   AWS_REGION=ap-south-1
    #   WEB_CONCURRENCY=4
    environment:
      ENV: cloud
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes: []             # no volume mount in prod
    # CMD from Dockerfile prod stage runs: alembic upgrade head + uvicorn workers
