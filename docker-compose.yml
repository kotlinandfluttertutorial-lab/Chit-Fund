version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chitsmart_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chitsmart
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chitsmart_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chitsmart -d chitsmart_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chitsmart_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://chitsmart:password@db:5432/chitsmart_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
    driver: local
